
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>

<body onload="randomPilt()">

<h1>Piltide vahetus</h1>

<input type="button" value="Juhuslik pilt" onclick="randomPilt()">

<br><br>

<img id="randomPilt" src="1.png" alt="Juhuslik pilt" width="300" height="230">

<h2>Arva ära!</h2>
<p>Milline pilt on ekraanil?</p>

<input type="radio" name="valik" id="v1" value="1.png" onclick="radioValik()">
<label for="v1"><img src="1.png" width="60" height="60" alt="Pilt 1"></label>
<br>

<input type="radio" name="valik" id="v2" value="2.png" onclick="radioValik()">
<label for="v2"><img src="2.png" width="60" height="60" alt="Pilt 2"></label>
<br>

<input type="radio" name="valik" id="v3" value="3.png" onclick="radioValik()">
<label for="v3"><img src="3.png" width="60" height="60" alt="Pilt 3"></label>
<br>

<input type="radio" name="valik" id="v4" value="tyhi.png" onclick="radioValik()">
<label for="v4"><img src="tyhi.png" width="60" height="60" alt="Pilt 4"></label>
<br>

<p id="vastus">Siia tuleb vastus</p>

</body>
</html>
