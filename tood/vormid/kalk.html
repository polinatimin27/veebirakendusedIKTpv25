
<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <script src="../js/kalc.js"></script>
    <script src="../js/tempTeisendus.js"></script>
    <link rel="stylesheet" href="kalkStyle.css">
</head>
<body>

<h1>Kalkulaatorid</h1>

<section id="osa1">
    <h2>Saia kalkulaator</h2>

    <label for="kogus">Kogus:</label>
    <input type="number" id="kogus" min="1" max="10"
           step="1" value="2" onchange="saiaKalk()">
    <br>

    <label for="saiatyyp">Palun vali saia tüüp</label>
    <select name="saiatyyp" id="saiatyyp" onchange="saiaKalk()">
        <option value="vali">Vali...</option>
        <option value="mooni">Moonisai</option>
        <option value="juustu">Juustusai</option>
        <option value="pontsik">Pontšik</option>
        <option value="kaneeli">Kaneelisai</option>
    </select>

    <br><br>

    <img id="pilt" alt="Sai" hidden>
    <p id="vastus"></p>
</section>

<section id="osa2">
    <h2>Temperatuuri kalkulaator</h2>

    <label for="temp">Sisesta temperatuur</label>
    <input type="number" id="temp" min="-50" max="50"
           step="1" value="0" onchange="tempTeisendus()">
    <br>

    <input type="radio" name="tempValik" id="celsius"
           value="celsius" onchange="tempTeisendus()">
    <label for="celsius">C - Celsius</label>
    <br>

    <input type="radio" name="tempValik" id="fahrenheit"
           value="fahrenheit" onchange="tempTeisendus()">
    <label for="fahrenheit">F - Fahrenheit</label>
    <br>

    <div id="vastus2"></div>

    <br>
    <img src="images.png" alt="Ilmaennustus" width="180">
</section>

</body>
</html>
