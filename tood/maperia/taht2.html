<!DOCTYPE html>
<html lang="et">

<head>
  <meta charset="UTF-8">
  <title>Põhjanael</title>
  <link rel="stylesheet" href="mapStyle.css">
</head>

<body>

<img src="map.png" alt="Tähed" usemap="#tahedkaart">

<map name="tahedkaart">

  <area shape="circle"
        coords="185,100,45"
        href="taht1.html"
        alt="Suur täht">

  <area shape="rect"
        coords="55,180,110,240"
        href="taht2.html"
        alt="Põhjanael">

  <area shape="poly"
        coords="65,45,80,75,50,75"
        href="taht3.html"
        alt="Väike täht">

  <area shape="circle"
        coords="55,110,35"
        href="kuu.html"
        alt="Kuu">

  <area shape="circle"
        coords="185,225,25"
        href="suda.html"
        alt="Süda">

</map>

<div id="selgitus">

  <h2>Põhjanael</h2>

  <img src="taht2.png"
       alt="Põhjanael"
       class="objektiPilt">

  <p>
    Põhjanael on üks tuntumaid tähti öötaevas.
    See asub peaaegu põhjapooluse kohal ja näitab põhjasuunda.
    Sellepärast kasutasid inimesed seda vanasti reisimisel ja
    merel navigeerimisel. Põhjanael tundub taevas peaaegu paigal,
    samal ajal kui teised tähed liiguvad selle ümber.
  </p>

</div>

</body>
</html>
