<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Väike täht</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>

<body>

<img src="map.png" alt="tähed" usemap="#tahedkaart">

<map name="tahedkaart">

    <area shape="circle"
          coords="185,100,45"
          href="taht1.html"
          alt="suur täht">

    <area shape="rect"
          coords="55,180,110,240"
          href="taht2.html"
          alt="täht">

    <area shape="poly"
          coords="65,45,80,75,50,75"
          href="taht3.html"
          alt="väike täht">

</map>

<div id="selgitus">
    Väike täht on üks pildi väiksematest tähtedest.
    See asub pildi ülemises osas ja on kollast värvi.
</div>

</body>
</html>
